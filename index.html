<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studying Timer</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e3e1dc;
    --accent: #ff8a00;
    --accent-soft: #fff1e0;
    --up: #2f7fe0;
    --up-soft: #e4effc;
    --add: #1f9d55;
    --sub: #d64545;
    --ring-track: #ebe8e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa2;
      --line: #2e2e33;
      --accent: #ff9f2e;
      --accent-soft: #33240f;
      --up: #5aa2ff;
      --up-soft: #15243a;
      --add: #3ccf7c;
      --sub: #ff6b6b;
      --ring-track: #2a2a2f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--muted); text-align: center; letter-spacing: .02em; }
  button { font-family: inherit; }

  /* ---------- timer list ---------- */
  .timers { display: flex; flex-direction: column; gap: 8px; }
  .trow {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 10px 10px 14px; cursor: pointer;
  }
  .trow.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .trow.up.sel { border-color: var(--up); box-shadow: 0 0 0 1px var(--up); }
  .trow .info { flex: 1; min-width: 0; }
  .trow .name { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .sub { font-size: .78rem; color: var(--muted); }
  .trow .time { font-variant-numeric: tabular-nums; font-size: 1.25rem; font-weight: 400; }
  .trow.done .time { color: var(--sub); animation: blink 1s steps(2) infinite; }
  .trow .go {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent-soft); color: var(--accent); font-size: .95rem; flex: none;
  }
  .trow.up .go { background: var(--up-soft); color: var(--up); }
  .trow .go.running { background: color-mix(in srgb, var(--sub) 18%, transparent); color: var(--sub); }
  .trow .go:disabled { opacity: .35; cursor: default; }
  .newbtn {
    border: 1.5px dashed var(--line); background: none; color: var(--muted);
    border-radius: 14px; padding: 12px; font-size: .95rem; cursor: pointer; font-weight: 500;
  }
  .newbtn:hover { color: var(--text); border-color: var(--muted); }

  /* ---------- clock face ---------- */
  .face { position: relative; width: min(320px, 82vw); aspect-ratio: 1; margin: 0 auto; }
  .face svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .face circle { fill: none; stroke-width: 10; }
  .track { stroke: var(--ring-track); }
  .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .face.up .progress { stroke: var(--up); }
  .readout {
    position: absolute; inset: 12%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center;
  }
  #faceName {
    font-size: 1rem; font-weight: 600; max-width: 100%;
    background: none; border: 1px solid transparent; border-radius: 8px;
    color: var(--text); text-align: center; padding: 2px 6px; width: 100%;
  }
  #faceName:hover { border-color: var(--line); }
  #display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(2rem, 10vw, 3.3rem);
    font-weight: 300;
    letter-spacing: -.02em;
  }
  #display.long { font-size: clamp(1.7rem, 8.5vw, 2.6rem); }
  #status { font-size: .88rem; color: var(--muted); }
  #endsAt { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
  .face.done .progress { stroke: var(--sub); }
  .face.done #display { color: var(--sub); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---------- controls ---------- */
  .controls { display: flex; justify-content: center; gap: 28px; align-items: center; }
  .round {
    width: 84px; height: 84px; border-radius: 50%;
    border: none; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: transform .08s;
  }
  .round:active { transform: scale(.96); }
  .round:disabled { opacity: .4; cursor: default; }
  #resetBtn { background: var(--line); color: var(--text); }
  #startBtn { background: var(--accent-soft); color: var(--accent); }
  .face.up ~ .controls #startBtn { background: var(--up-soft); color: var(--up); }
  #startBtn.running, .face.up ~ .controls #startBtn.running { background: color-mix(in srgb, var(--sub) 18%, transparent); color: var(--sub); }
  #deleteBtn {
    background: none; border: none; color: var(--muted); font-size: .85rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  #deleteBtn:hover { color: var(--sub); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .card h2 { margin: 0; font-size: .95rem; font-weight: 600; }
  .card h2 small { font-weight: 400; color: var(--muted); }

  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: none; background: none; color: var(--muted);
    padding: 8px; border-radius: 8px; font-size: .9rem; cursor: pointer; font-weight: 500;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .fields { display: flex; gap: 10px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: .75rem; color: var(--muted); }
  input, select {
    width: 100%;
    font-size: 1.25rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 0;
    font-family: inherit;
  }
  select, #newName { font-size: 1rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hidden { display: none !important; }

  #preview { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  #preview.err { color: var(--sub); }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .actions button, .primary {
    border: none; border-radius: 10px; padding: 12px 8px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  #setBtn, .primary { background: var(--accent); color: #fff; }
  #addBtn { background: color-mix(in srgb, var(--add) 16%, transparent); color: var(--add); }
  #subBtn { background: color-mix(in srgb, var(--sub) 16%, transparent); color: var(--sub); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ghost { border: 1px solid var(--line); background: none; color: var(--text); border-radius: 10px; padding: 12px 8px; font-size: .95rem; cursor: pointer; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: .85rem; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chips button.minus { color: var(--sub); }
  .chips button.plus { color: var(--add); }

  #log { list-style: none; margin: 0; padding: 0; font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; }
  .hint { font-size: .78rem; color: var(--muted); text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>Studying Timer</h1>

  <div class="timers" id="timerList"></div>
  <button class="newbtn" id="newBtn">+ New timer</button>

  <section class="card hidden" id="newCard">
    <h2>New timer</h2>
    <div class="field"><label for="newName">Name</label><input id="newName" maxlength="60" placeholder="e.g. Biology this week"></div>
    <div class="seg">
      <button id="newDown" class="on">Countdown</button>
      <button id="newUp">Stopwatch (counts up)</button>
    </div>
    <div class="row2">
      <button class="ghost" id="newCancel">Cancel</button>
      <button class="primary" id="newCreate">Create</button>
    </div>
  </section>

  <div id="selectedView">
    <div class="face" id="face">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" id="ring" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="readout">
        <input id="faceName" maxlength="60" aria-label="Timer name" title="Click to rename">
        <div id="display">00:00:00</div>
        <div id="status"></div>
        <div id="endsAt"></div>
      </div>
    </div>

    <div class="controls">
      <button class="round" id="resetBtn">Reset</button>
      <button class="round" id="startBtn">Start</button>
    </div>
    <p style="text-align:center;margin:12px 0 0"><button id="deleteBtn">Delete this timer</button></p>
  </div>
  <div class="empty hidden" id="emptyView">No timers yet — make one above.</div>

  <section class="card" id="entryCard">
    <h2>Change time <small id="entryFor"></small></h2>
    <div class="seg">
      <button id="modeExact" class="on">Exact (h · m · s)</button>
      <button id="modeDecimal">Decimal</button>
    </div>

    <div class="fields" id="exactFields">
      <div class="field"><label for="inH">Hours</label><input id="inH" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="inM">Minutes</label><input id="inM" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="inS">Seconds</label><input id="inS" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
    </div>

    <div class="fields hidden" id="decimalFields">
      <div class="field" style="flex:2"><label for="inDec">Amount</label><input id="inDec" type="number" min="0" step="any" inputmode="decimal" placeholder="1.11"></div>
      <div class="field"><label for="inUnit">Unit</label>
        <select id="inUnit">
          <option value="3600">hours</option>
          <option value="60">minutes</option>
          <option value="1">seconds</option>
        </select>
      </div>
    </div>

    <div id="preview"></div>

    <div class="actions">
      <button id="setBtn">Set</button>
      <button id="addBtn">+ Add</button>
      <button id="subBtn">− Subtract</button>
    </div>

    <div class="chips" id="chips"></div>
  </section>

  <section class="card">
    <h2>History</h2>
    <ul id="log"><li>Nothing yet.</li></ul>
  </section>

  <p class="hint">Space = start/pause selected · Enter = set · timers keep running in the background and survive refresh</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORE = 'studying-timer-v2';
  const OLD_STORE = 'studying-timer-v1';

  // ----- state -----
  // Each timer stores `base` (ms) and, while running, `since` (timestamp it was started).
  //   countdown: remaining = base - (now - since)
  //   stopwatch: elapsed   = base + (now - since)
  let state = { timers: [], selected: null, mode: 'exact', log: [] };
  let newType = 'down';

  const uid = () => Math.random().toString(36).slice(2, 10);
  const makeTimer = (name, type) => ({ id: uid(), name, type, base: 0, since: 0, running: false, total: 0, done: false });

  const load = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE));
      if (saved) { Object.assign(state, saved); return; }
      // migrate the single timer from v1
      const old = JSON.parse(localStorage.getItem(OLD_STORE));
      if (old) {
        const t = makeTimer('Timer 1', 'down');
        t.total = old.total || 0;
        t.done = !!old.done;
        if (old.running) { t.running = true; t.since = Date.now(); t.base = Math.max(0, old.endAt - Date.now()); }
        else t.base = old.remaining || 0;
        state.timers = [t];
        state.selected = t.id;
        state.mode = old.mode || 'exact';
        state.log = old.log || [];
      }
    } catch {}
  };
  const save = () => {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {}
  };

  const sel = () => state.timers.find(t => t.id === state.selected) || null;

  // ----- time helpers -----
  const valueMs = t => {
    if (!t.running) return t.base;
    const d = Date.now() - t.since;
    return t.type === 'down' ? Math.max(0, t.base - d) : t.base + d;
  };
  // Freeze the running value into base, restarting the clock from now.
  const rebase = t => { t.base = valueMs(t); if (t.running) t.since = Date.now(); };

  const fmtClock = (ms, type) => {
    const t = type === 'down' ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
    const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  };

  const fmtWords = sec => {
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const parts = [];
    if (h) parts.push(`${h} hr`);
    if (m) parts.push(`${m} min`);
    if (s || !parts.length) parts.push(`${s} sec`);
    return parts.join(' ');
  };

  // Reads the entry fields and returns whole seconds, null if empty, NaN if invalid.
  const readEntry = () => {
    if (state.mode === 'exact') {
      const vals = ['inH', 'inM', 'inS'].map(id => $(id).value.trim());
      if (vals.every(v => v === '')) return null;
      const [h, m, s] = vals.map(v => v === '' ? 0 : Number(v));
      if ([h, m, s].some(n => !isFinite(n) || n < 0)) return NaN;
      return Math.round(h * 3600 + m * 60 + s);
    }
    const v = $('inDec').value.trim();
    if (v === '') return null;
    const n = Number(v);
    if (!isFinite(n) || n < 0) return NaN;
    return Math.round(n * Number($('inUnit').value));
  };

  // ----- actions -----
  const addLog = (t, text) => {
    const now = new Date().toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    state.log.unshift(`${now} — ${t ? t.name + ': ' : ''}${text}`);
    state.log = state.log.slice(0, 50);
  };

  const createTimer = (name, type) => {
    name = name.trim() || `${type === 'down' ? 'Timer' : 'Stopwatch'} ${state.timers.length + 1}`;
    const t = makeTimer(name, type);
    state.timers.push(t);
    state.selected = t.id;
    addLog(t, `created (${type === 'down' ? 'countdown' : 'stopwatch'})`);
    commit();
  };

  const deleteTimer = t => {
    if (!confirm(`Delete "${t.name}"?`)) return;
    const i = state.timers.indexOf(t);
    state.timers.splice(i, 1);
    state.selected = (state.timers[i] || state.timers[i - 1] || {}).id || null;
    addLog(null, `Deleted "${t.name}"`);
    stopAlarmIfQuiet();
    commit();
  };

  const setTime = (t, sec) => {
    t.done = false;
    t.base = sec * 1000;
    t.total = sec * 1000;
    if (t.running) t.since = Date.now();
    addLog(t, `set to ${fmtWords(sec)}`);
    stopAlarmIfQuiet();
    commit();
  };

  const adjust = (t, sec) => {
    if (!sec) return;
    rebase(t);
    const before = t.base;
    const after = Math.max(0, before + sec * 1000);
    t.base = after;
    if (t.type === 'down') {
      t.total = Math.max(after, t.total + (after - before), 1);
      if (after > 0) t.done = false;
    }
    addLog(t, `${sec > 0 ? '+' : '−'} ${fmtWords(Math.abs(sec))}${after === 0 && sec < 0 ? ' (hit zero)' : ''}`);
    if (t.type === 'down' && after === 0 && t.running) finish(t);
    stopAlarmIfQuiet();
    commit();
  };

  const start = t => {
    if (t.running) return;
    if (t.type === 'down' && t.base <= 0) return;
    unlockAudio();
    t.since = Date.now();
    t.running = true;
    t.done = false;
    commit();
  };

  const pause = t => {
    if (!t.running) return;
    rebase(t);
    t.running = false;
    commit();
  };

  const toggle = t => { t.running ? pause(t) : start(t); stopAlarmIfQuiet(); };

  const reset = t => {
    t.running = false;
    t.base = t.type === 'down' ? t.total : 0;
    t.done = false;
    addLog(t, 'reset');
    stopAlarmIfQuiet();
    commit();
  };

  const finish = t => {
    t.running = false;
    t.base = 0;
    t.done = true;
    addLog(t, 'time’s up!');
    save();
    startAlarm();
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('Studying Timer', { body: `${t.name}: time’s up!` }); } catch {}
    }
  };

  // ----- alarm (Web Audio, no files needed) -----
  let audioCtx = null, alarmTimer = null;
  const unlockAudio = () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch {}
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
  };
  const beep = () => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [0, 0.18, 0.36].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.15);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + off); o.stop(t + off + 0.16);
    });
  };
  const startAlarm = () => {
    stopAlarm();
    beep();
    let n = 0;
    alarmTimer = setInterval(() => { beep(); if (++n >= 20) stopAlarm(); }, 1200);
  };
  const stopAlarm = () => { clearInterval(alarmTimer); alarmTimer = null; };
  const stopAlarmIfQuiet = () => { if (!state.timers.some(t => t.done)) stopAlarm(); };

  // ----- rendering -----
  const ring = $('ring');
  const CIRC = 2 * Math.PI * 54;
  ring.style.strokeDasharray = CIRC;
  const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  const statusOf = t => {
    const ms = valueMs(t);
    if (t.done) return 'Time’s up!';
    if (t.running) return t.type === 'down' ? 'Counting down' : 'Counting up';
    if (t.type === 'down') return ms > 0 ? 'Paused' : 'Set a time';
    return ms > 0 ? 'Paused' : 'Ready';
  };

  // Build the list rows once per structural change; tick() only updates text.
  const buildList = () => {
    $('timerList').innerHTML = state.timers.map(t => `
      <div class="trow ${t.type}" data-id="${t.id}">
        <div class="info">
          <div class="name">${esc(t.name)}</div>
          <div class="sub"></div>
        </div>
        <div class="time"></div>
        <button class="go" aria-label="Start or pause"></button>
      </div>`).join('');
  };

  const renderList = () => {
    document.querySelectorAll('.trow').forEach(row => {
      const t = state.timers.find(x => x.id === row.dataset.id);
      if (!t) return;
      const ms = valueMs(t);
      row.classList.toggle('sel', t.id === state.selected);
      row.classList.toggle('done', t.done);
      row.querySelector('.time').textContent = fmtClock(ms, t.type);
      row.querySelector('.sub').textContent = `${t.type === 'down' ? '⏳ Countdown' : '⏱ Stopwatch'} · ${statusOf(t)}`;
      const go = row.querySelector('.go');
      go.textContent = t.running ? '❚❚' : '▶';
      go.classList.toggle('running', t.running);
      go.disabled = !t.running && t.type === 'down' && ms <= 0;
    });
  };

  const renderSelected = () => {
    const t = sel();
    $('selectedView').classList.toggle('hidden', !t);
    $('entryCard').classList.toggle('hidden', !t);
    $('emptyView').classList.toggle('hidden', !!t);
    if (!t) { document.title = 'Studying Timer'; return; }

    const ms = valueMs(t);
    const text = fmtClock(ms, t.type);
    $('display').textContent = text;
    $('display').classList.toggle('long', text.length > 8);
    if (document.activeElement !== $('faceName')) $('faceName').value = t.name;

    const frac = t.type === 'down'
      ? (t.total > 0 ? Math.min(1, ms / t.total) : 0)
      : (ms % 60000) / 60000; // stopwatch: sweep once per minute
    ring.style.transition = t.type === 'up' && frac < 0.01 ? 'none' : '';
    ring.style.strokeDashoffset = CIRC * (1 - frac);
    $('face').classList.toggle('done', t.done);
    $('face').classList.toggle('up', t.type === 'up');

    $('status').textContent = statusOf(t);
    $('endsAt').textContent = t.running && t.type === 'down'
      ? 'Ends at ' + new Date(t.since + t.base).toLocaleString([], { weekday: ms > 86400000 ? 'short' : undefined, hour: 'numeric', minute: '2-digit' })
      : '';

    const sb = $('startBtn');
    const fresh = t.type === 'down' ? t.base === t.total : t.base === 0;
    sb.textContent = t.running ? 'Pause' : (fresh ? 'Start' : 'Resume');
    sb.classList.toggle('running', t.running);
    sb.disabled = !t.running && t.type === 'down' && ms <= 0;

    $('entryFor').textContent = `— ${t.name}`;
    $('setBtn').textContent = t.type === 'down' ? 'Set' : 'Set total';

    const running = state.timers.filter(x => x.running);
    const anyDone = state.timers.some(x => x.done);
    document.title = anyDone ? '⏰ Time’s up!'
      : t.running ? `${text} · ${t.name}`
      : running.length ? `${running.length} running · Studying Timer`
      : 'Studying Timer';
  };

  const renderLog = () => {
    $('log').innerHTML = state.log.length
      ? state.log.map(l => `<li>${esc(l)}</li>`).join('')
      : '<li>Nothing yet.</li>';
  };

  const renderPreview = () => {
    const sec = readEntry();
    const p = $('preview');
    p.classList.toggle('err', Number.isNaN(sec));
    if (sec === null) p.textContent = '';
    else if (Number.isNaN(sec)) p.textContent = 'Enter a non-negative number';
    else p.textContent = `= ${fmtWords(sec)}`;
  };

  const renderMode = () => {
    const exact = state.mode === 'exact';
    $('modeExact').classList.toggle('on', exact);
    $('modeDecimal').classList.toggle('on', !exact);
    $('exactFields').classList.toggle('hidden', !exact);
    $('decimalFields').classList.toggle('hidden', exact);
    renderPreview();
  };

  const render = () => { renderList(); renderSelected(); };
  const commit = () => { save(); buildList(); render(); renderLog(); };

  // ----- quick chips -----
  [[-600, '−10m'], [-300, '−5m'], [-60, '−1m'], [60, '+1m'], [300, '+5m'], [600, '+10m'], [1800, '+30m'], [3600, '+1h']]
    .forEach(([sec, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = sec < 0 ? 'minus' : 'plus';
      b.onclick = () => { const t = sel(); if (t) adjust(t, sec); };
      $('chips').appendChild(b);
    });

  // ----- wiring -----
  $('timerList').addEventListener('click', e => {
    const row = e.target.closest('.trow');
    if (!row) return;
    const t = state.timers.find(x => x.id === row.dataset.id);
    if (e.target.closest('.go')) { toggle(t); return; }
    state.selected = t.id;
    save(); render();
  });

  const openNew = show => {
    $('newCard').classList.toggle('hidden', !show);
    $('newBtn').classList.toggle('hidden', show);
    if (show) { $('newName').value = ''; $('newName').focus(); }
  };
  const setNewType = type => {
    newType = type;
    $('newDown').classList.toggle('on', type === 'down');
    $('newUp').classList.toggle('on', type === 'up');
  };
  $('newBtn').onclick = () => openNew(true);
  $('newCancel').onclick = () => openNew(false);
  $('newDown').onclick = () => setNewType('down');
  $('newUp').onclick = () => setNewType('up');
  $('newCreate').onclick = () => { createTimer($('newName').value, newType); openNew(false); };
  $('newName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('newCreate').click(); } });

  const rename = () => {
    const t = sel(); if (!t) return;
    const name = $('faceName').value.trim();
    if (name && name !== t.name) { addLog(t, `renamed to "${name}"`); t.name = name; commit(); }
    else $('faceName').value = t.name;
  };
  $('faceName').addEventListener('change', rename);
  $('faceName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('faceName').blur(); } });

  const withEntry = fn => () => {
    const t = sel(); if (!t) return;
    const sec = readEntry();
    if (sec === null || Number.isNaN(sec)) {
      renderPreview(); $('preview').classList.add('err');
      if (sec === null) $('preview').textContent = 'Enter a time first';
      return;
    }
    fn(t, sec);
  };

  $('setBtn').onclick = withEntry(setTime);
  $('addBtn').onclick = withEntry((t, sec) => adjust(t, sec));
  $('subBtn').onclick = withEntry((t, sec) => adjust(t, -sec));
  $('startBtn').onclick = () => { const t = sel(); if (t) toggle(t); };
  $('resetBtn').onclick = () => { const t = sel(); if (t) reset(t); };
  $('deleteBtn').onclick = () => { const t = sel(); if (t) deleteTimer(t); };
  $('modeExact').onclick = () => { state.mode = 'exact'; save(); renderMode(); };
  $('modeDecimal').onclick = () => { state.mode = 'decimal'; save(); renderMode(); };
  ['inH', 'inM', 'inS', 'inDec', 'inUnit'].forEach(id => $(id).addEventListener('input', renderPreview));

  document.addEventListener('keydown', e => {
    const typing = e.target.matches('input, select');
    if (e.code === 'Space' && !typing) { e.preventDefault(); $('startBtn').click(); }
    if (e.key === 'Enter' && typing && ['inH', 'inM', 'inS', 'inDec'].includes(e.target.id)) { e.preventDefault(); $('setBtn').click(); }
  });

  // ----- tick -----
  const checkFinished = () => {
    let changed = false;
    state.timers.forEach(t => {
      if (t.running && t.type === 'down' && valueMs(t) <= 0) { finish(t); changed = true; }
    });
    return changed;
  };
  const tick = () => { if (checkFinished()) commit(); else render(); };

  load();
  if (!state.timers.length) createTimer('Timer 1', 'down');
  if (!sel()) state.selected = state.timers[0].id;
  checkFinished();
  renderMode();
  commit();
  setInterval(tick, 200);
})();
</script>
</body>
</html>
