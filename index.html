<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studying Timer</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e3e1dc;
    --accent: #ff8a00;
    --accent-soft: #fff1e0;
    --up: #2f7fe0;
    --up-soft: #e4effc;
    --add: #1f9d55;
    --sub: #d64545;
    --ring-track: #ebe8e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa2;
      --line: #2e2e33;
      --accent: #ff9f2e;
      --accent-soft: #33240f;
      --up: #5aa2ff;
      --up-soft: #15243a;
      --add: #3ccf7c;
      --sub: #ff6b6b;
      --ring-track: #2a2a2f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--muted); text-align: center; letter-spacing: .02em; }
  button { font-family: inherit; }

  /* ---------- timer list ---------- */
  .timers { display: flex; flex-direction: column; gap: 8px; }
  .trow {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 10px 10px 14px; cursor: pointer;
  }
  .trow.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .trow.up.sel { border-color: var(--up); box-shadow: 0 0 0 1px var(--up); }
  .trow .info { flex: 1; min-width: 0; }
  .trow .name { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .sub { font-size: .78rem; color: var(--muted); }
  .trow .time { font-variant-numeric: tabular-nums; font-size: 1.25rem; font-weight: 400; }
  .trow.done .time { color: var(--sub); animation: blink 1s steps(2) infinite; }
  .trow.over .time { color: var(--sub); }
  .trow .go {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent-soft); color: var(--accent); font-size: .95rem; flex: none;
  }
  .trow.up .go { background: var(--up-soft); color: var(--up); }
  .trow .go.running { background: color-mix(in srgb, var(--sub) 18%, transparent); color: var(--sub); }
  .trow .go:disabled { opacity: .35; cursor: default; }
  .newbtn {
    border: 1.5px dashed var(--line); background: none; color: var(--muted);
    border-radius: 14px; padding: 12px; font-size: .95rem; cursor: pointer; font-weight: 500;
  }
  .newbtn:hover { color: var(--text); border-color: var(--muted); }

  /* ---------- clock face ---------- */
  .face { position: relative; width: min(320px, 82vw); aspect-ratio: 1; margin: 0 auto; }
  .face svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .face circle { fill: none; stroke-width: 10; }
  .track { stroke: var(--ring-track); }
  .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .face.up .progress { stroke: var(--up); }
  .readout {
    position: absolute; inset: 12%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center;
  }
  #faceName {
    font-size: 1rem; font-weight: 600; max-width: 100%;
    background: none; border: 1px solid transparent; border-radius: 8px;
    color: var(--text); text-align: center; padding: 2px 6px; width: 100%;
  }
  #faceName:hover { border-color: var(--line); }
  #display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(2rem, 10vw, 3.3rem);
    font-weight: 300;
    letter-spacing: -.02em;
  }
  #display.long { font-size: clamp(1.7rem, 8.5vw, 2.6rem); }
  #status { font-size: .88rem; color: var(--muted); }
  #endsAt { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
  .face.done .progress, .face.over .progress { stroke: var(--sub); }
  .face.over #display { color: var(--sub); }
  .face.done #display { color: var(--sub); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---------- controls ---------- */
  .controls { display: flex; justify-content: center; gap: 28px; align-items: center; }
  .round {
    width: 84px; height: 84px; border-radius: 50%;
    border: none; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: transform .08s;
  }
  .round:active { transform: scale(.96); }
  .round:disabled { opacity: .4; cursor: default; }
  #resetBtn { background: var(--line); color: var(--text); }
  #startBtn { background: var(--accent-soft); color: var(--accent); }
  .face.up ~ .controls #startBtn { background: var(--up-soft); color: var(--up); }
  #startBtn.running, .face.up ~ .controls #startBtn.running { background: color-mix(in srgb, var(--sub) 18%, transparent); color: var(--sub); }
  #deleteBtn {
    border: 1px solid color-mix(in srgb, var(--sub) 40%, transparent);
    background: none; color: var(--sub); border-radius: 999px;
    padding: 8px 16px; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  #deleteBtn:hover { background: color-mix(in srgb, var(--sub) 10%, transparent); }
  #deleteBtn.finished { background: var(--sub); border-color: var(--sub); color: #fff; }
  .trow .del {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: none; color: var(--muted); font-size: 1rem;
  }
  .trow .del:hover { color: var(--sub); background: color-mix(in srgb, var(--sub) 12%, transparent); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .card h2 { margin: 0; font-size: .95rem; font-weight: 600; }
  .card h2 small { font-weight: 400; color: var(--muted); }

  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: none; background: none; color: var(--muted);
    padding: 8px; border-radius: 8px; font-size: .9rem; cursor: pointer; font-weight: 500;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .fields { display: flex; gap: 10px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: .75rem; color: var(--muted); }
  input, select {
    width: 100%;
    font-size: 1.25rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 0;
    font-family: inherit;
  }
  select, #newName { font-size: 1rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hidden { display: none !important; }

  #preview { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  #preview.err { color: var(--sub); }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .actions button, .primary {
    border: none; border-radius: 10px; padding: 12px 8px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  #setBtn, .primary { background: var(--accent); color: #fff; }
  #addBtn { background: color-mix(in srgb, var(--add) 16%, transparent); color: var(--add); }
  #subBtn { background: color-mix(in srgb, var(--sub) 16%, transparent); color: var(--sub); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ghost { border: 1px solid var(--line); background: none; color: var(--text); border-radius: 10px; padding: 12px 8px; font-size: .95rem; cursor: pointer; }

  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .chips button {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 6px 4px; font-size: .85rem; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chips button.minus { color: var(--sub); }
  .chips button.plus { color: var(--add); }

  /* ---------- recently deleted ---------- */
  .trash { display: flex; flex-direction: column; gap: 8px; }
  .trash-row { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
  .trash-row .info { flex: 1; min-width: 0; }
  .trash-row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trash-row .sub { font-size: .78rem; color: var(--muted); }
  .trash-row button { border: 1px solid var(--line); background: none; color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: .82rem; cursor: pointer; flex: none; }
  .trash-row button.restore { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note { font-size: .78rem; color: var(--muted); margin: 0; }

  /* ---------- stats ---------- */
  .stats-total { font-size: .9rem; color: var(--muted); margin: 0; }
  .stats-total b { color: var(--text); font-variant-numeric: tabular-nums; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .stat-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stat-head .name { font-weight: 600; }
  .badge { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .badge.active { background: color-mix(in srgb, var(--add) 16%, transparent); color: var(--add); }
  .badge.deleted { background: color-mix(in srgb, var(--sub) 14%, transparent); color: var(--sub); }
  .stat dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 14px; margin: 0; }
  .stat dt { font-size: .72rem; color: var(--muted); }
  .stat dd { margin: 0; font-size: .88rem; font-variant-numeric: tabular-nums; }
  .stat dd small { color: var(--muted); }
  .edit-spent { border: none; background: none; color: var(--accent); font-size: .78rem; cursor: pointer; padding: 0 2px; text-decoration: underline; text-underline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px;
    display: flex; gap: 14px; align-items: center; font-size: .9rem; max-width: calc(100% - 32px);
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .toast button { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: .9rem; }
  .hint { font-size: .78rem; color: var(--muted); text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>Studying Timer</h1>

  <div class="timers" id="timerList"></div>
  <button class="newbtn" id="newBtn">+ New timer</button>

  <section class="card hidden" id="newCard">
    <h2>New timer</h2>
    <div class="field"><label for="newName">Name</label><input id="newName" maxlength="60" placeholder="e.g. Biology this week"></div>
    <div class="seg">
      <button id="newDown" class="on">Countdown</button>
      <button id="newUp">Stopwatch (counts up)</button>
    </div>
    <div class="row2">
      <button class="ghost" id="newCancel">Cancel</button>
      <button class="primary" id="newCreate">Create</button>
    </div>
  </section>

  <div id="selectedView">
    <div class="face" id="face">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" id="ring" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="readout">
        <input id="faceName" maxlength="60" aria-label="Timer name" title="Click to rename">
        <div id="display">00:00:00</div>
        <div id="status"></div>
        <div id="endsAt"></div>
      </div>
    </div>

    <div class="controls">
      <button class="round" id="resetBtn">Reset</button>
      <button class="round" id="startBtn">Start</button>
    </div>
    <p style="text-align:center;margin:14px 0 0"><button id="deleteBtn">🗑 Delete timer</button></p>
  </div>
  <div class="empty hidden" id="emptyView">No timers yet — make one above.</div>

  <section class="card" id="entryCard">
    <h2>Change time <small id="entryFor"></small></h2>
    <div class="seg">
      <button id="modeExact" class="on">Exact (h · m · s)</button>
      <button id="modeDecimal">Decimal</button>
    </div>

    <div class="fields" id="exactFields">
      <div class="field"><label for="inH">Hours</label><input id="inH" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="inM">Minutes</label><input id="inM" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="inS">Seconds</label><input id="inS" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
    </div>

    <div class="fields hidden" id="decimalFields">
      <div class="field" style="flex:2"><label for="inDec">Amount</label><input id="inDec" type="number" min="0" step="any" inputmode="decimal" placeholder="1.11"></div>
      <div class="field"><label for="inUnit">Unit</label>
        <select id="inUnit">
          <option value="3600">hours</option>
          <option value="60">minutes</option>
          <option value="1">seconds</option>
        </select>
      </div>
    </div>

    <div id="preview"></div>

    <div class="actions">
      <button id="setBtn">Set</button>
      <button id="addBtn">+ Add</button>
      <button id="subBtn">− Subtract</button>
    </div>

    <div class="chips" id="chips"></div>
  </section>

  <section class="card">
    <h2>Stats</h2>
    <p class="stats-total" id="statsTotal"></p>
    <div id="statsList" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <section class="card hidden" id="trashCard">
    <h2>Recently deleted</h2>
    <div class="trash" id="trashList"></div>
    <p class="note">Deleted timers can be restored for 30 days. Their stats stay above either way.</p>
  </section>

  <p class="hint">Space = start/pause selected · Enter = set · timers keep running in the background and survive refresh</p>
</main>
<div class="toast hidden" id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORE = 'studying-timer-v2';
  const OLD_STORE = 'studying-timer-v1';

  // ----- state -----
  // Each timer stores `base` (ms) and, while running, `since` (timestamp it was started).
  //   countdown: remaining = base - (now - since)
  //   stopwatch: elapsed   = base + (now - since)
  // timers  = active timers
  // trash   = deleted timers that can still be restored (for TRASH_DAYS)
  // archive = timers deleted for good; kept only so their stats still show
  let state = { timers: [], trash: [], archive: [], selected: null, mode: 'exact' };
  let newType = 'down';
  const TRASH_DAYS = 30;

  const uid = () => Math.random().toString(36).slice(2, 10);
  const STAT_DEFAULTS = { createdAt: null, deletedAt: null, initial: null, runs: 0, adds: 0, subs: 0, spent: 0, removed: 0, spentFix: 0, runStart: 0 };
  const makeTimer = (name, type) => ({
    id: uid(), name, type, base: 0, since: 0, running: false, total: 0, done: false,
    ...STAT_DEFAULTS, createdAt: Date.now(),
  });

  const load = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE));
      if (saved) {
        Object.assign(state, saved);
        delete state.log;
        state.trash = state.trash || [];
        state.archive = state.archive || [];
        // timers from before stats existed: fill in what we can
        [...state.timers, ...state.trash, ...state.archive].forEach(t => {
          for (const k in STAT_DEFAULTS) if (t[k] === undefined) t[k] = STAT_DEFAULTS[k];
          if (t.initial === null && t.type === 'down' && t.total) t.initial = t.total;
          if (t.running && !t.runStart) t.runStart = t.since;
        });
        // move expired trash into the archive
        const cutoff = Date.now() - TRASH_DAYS * 86400000;
        state.archive.push(...state.trash.filter(t => t.deletedAt < cutoff));
        state.trash = state.trash.filter(t => t.deletedAt >= cutoff);
        return;
      }
      // migrate the single timer from v1
      const old = JSON.parse(localStorage.getItem(OLD_STORE));
      if (old) {
        const t = makeTimer('Timer 1', 'down');
        t.total = old.total || 0;
        t.done = !!old.done;
        if (old.running) { t.running = true; t.since = Date.now(); t.base = Math.max(0, old.endAt - Date.now()); }
        else t.base = old.remaining || 0;
        state.timers = [t];
        if (t.running) t.runStart = t.since;
        t.createdAt = null;
        t.initial = t.total || null;
        state.selected = t.id;
        state.mode = old.mode || 'exact';
      }
    } catch {}
  };
  const save = () => {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {}
  };

  const sel = () => state.timers.find(t => t.id === state.selected) || null;

  // ----- time helpers -----
  const valueMs = t => {
    if (!t.running) return t.base;
    const d = Date.now() - t.since;
    return t.type === 'down' ? t.base - d : t.base + d;  // can go negative (overtime)
  };
  // Freeze the running value into base, restarting the clock from now.
  const rebase = t => { t.base = valueMs(t); if (t.running) t.since = Date.now(); };

  const fmtClock = (ms, type) => {
    const whole = type === 'down' ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
    const sign = whole < 0 ? '−' : '';
    const t = Math.abs(whole);
    const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${sign}${pad(h)}:${pad(m)}:${pad(s)}`;
  };

  const fmtWords = sec => {
    sec = Math.round(sec);
    if (sec < 0) return '−' + fmtWords(-sec);
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const parts = [];
    if (h) parts.push(`${h} hr`);
    if (m) parts.push(`${m} min`);
    if (s || !parts.length) parts.push(`${s} sec`);
    return parts.join(' ');
  };

  // Reads the entry fields and returns whole seconds, null if empty, NaN if invalid.
  const readEntry = () => {
    if (state.mode === 'exact') {
      const vals = ['inH', 'inM', 'inS'].map(id => $(id).value.trim());
      if (vals.every(v => v === '')) return null;
      const [h, m, s] = vals.map(v => v === '' ? 0 : Number(v));
      if ([h, m, s].some(n => !isFinite(n) || n < 0)) return NaN;
      return Math.round(h * 3600 + m * 60 + s);
    }
    const v = $('inDec').value.trim();
    if (v === '') return null;
    const n = Number(v);
    if (!isFinite(n) || n < 0) return NaN;
    return Math.round(n * Number($('inUnit').value));
  };

  // ----- actions -----
  // Time actually spent running, including the current run.
  const runMs = t => t.spent + (t.running ? Date.now() - t.runStart : 0);
  // Time spent: for a countdown, everything that came off the clock, whether by running
  // or by subtracting (= initial + added − remaining). For a stopwatch, its running time.
  // spentFix = manual correction from the stats panel's Edit button
  const spentMs = t => runMs(t) + (t.type === 'down' ? t.removed : 0) + t.spentFix;
  // Close out the current run: add it to time spent and freeze the value.
  const stopRun = (t, endAt = Date.now()) => {
    if (!t.running) return;
    t.spent += Math.max(0, endAt - t.runStart);
    rebase(t);
    t.running = false;
  };

  const createTimer = (name, type) => {
    name = name.trim() || `${type === 'down' ? 'Timer' : 'Stopwatch'} ${state.timers.length + 1}`;
    const t = makeTimer(name, type);
    state.timers.push(t);
    state.selected = t.id;
    commit();
  };

  let toastTimer = null, lastDeleted = null;
  const showToast = text => {
    $('toastText').textContent = text;
    $('toast').classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 7000);
  };

  const deleteTimer = t => {
    stopRun(t);
    t.done = false;
    t.deletedAt = Date.now();
    const i = state.timers.indexOf(t);
    state.timers.splice(i, 1);
    state.trash.unshift(t);
    state.selected = (state.timers[i] || state.timers[i - 1] || {}).id || null;
    lastDeleted = t.id;
    showToast(`Deleted "${t.name}" — stats kept`);
    stopAlarm();
    commit();
  };

  const restoreTimer = id => {
    const t = state.trash.find(x => x.id === id);
    if (!t) return;
    state.trash = state.trash.filter(x => x !== t);
    t.deletedAt = null;
    state.timers.push(t);
    state.selected = t.id;
    $('toast').classList.add('hidden');
    commit();
  };

  const deleteForever = id => {
    const t = state.trash.find(x => x.id === id);
    if (!t || !confirm(`Permanently delete "${t.name}"? It can't be restored, but its stats will stay.`)) return;
    state.trash = state.trash.filter(x => x !== t);
    state.archive.unshift(t);
    commit();
  };

  const setTime = (t, sec) => {
    t.done = t.type === 'down' && sec <= 0;
    t.base = sec * 1000;
    t.total = sec * 1000;
    if (t.initial === null) t.initial = sec * 1000;
    if (t.running) t.since = Date.now();
    stopAlarm();
    commit();
  };

  const adjust = (t, sec) => {
    if (!sec) return;
    rebase(t);
    const before = t.base;
    const after = before + sec * 1000;  // no floor: subtracting can push it negative
    t.base = after;
    if (sec > 0) t.adds++; else { t.subs++; t.removed += -sec * 1000; }
    if (t.type === 'down') {
      // keep the ring's 100% mark sensible; overtime doesn't shrink it
      if (after > 0) t.total = Math.max(after, t.total + (after - before), 1);
      // back above zero = can ring again. Crossing zero while running rings on the next tick;
      // crossing while paused just marks it done so starting it later doesn't ring.
      if (after > 0) t.done = false;
      else if (!t.running) t.done = true;
    }
    stopAlarm();
    commit();
  };

  const start = t => {
    if (t.running) return;
    unlockAudio();
    t.since = t.runStart = Date.now();
    t.running = true;
    // starting at or below zero just keeps counting into overtime, without ringing
    t.done = t.type === 'down' && t.base <= 0;
    t.runs++;
    commit();
  };

  const pause = t => {
    if (!t.running) return;
    stopRun(t);
    commit();
  };

  const toggle = t => { t.running ? pause(t) : start(t); stopAlarm(); };

  const reset = t => {
    stopRun(t);
    t.base = t.type === 'down' ? t.total : 0;
    t.done = t.type === 'down' && t.base <= 0;
    stopAlarm();
    commit();
  };

  // A running countdown just crossed zero: ring, but keep it running into overtime.
  const finish = t => {
    t.done = true;
    save();
    startAlarm();
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('Studying Timer', { body: `${t.name}: time’s up!` }); } catch {}
    }
  };

  // ----- alarm (Web Audio, no files needed) -----
  let audioCtx = null, alarmTimer = null;
  const unlockAudio = () => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch {}
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
  };
  const beep = () => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [0, 0.18, 0.36].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.15);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + off); o.stop(t + off + 0.16);
    });
  };
  const startAlarm = () => {
    stopAlarm();
    beep();
    let n = 0;
    alarmTimer = setInterval(() => { beep(); if (++n >= 20) stopAlarm(); }, 1200);
  };
  const stopAlarm = () => { clearInterval(alarmTimer); alarmTimer = null; };

  // ----- rendering -----
  const ring = $('ring');
  const CIRC = 2 * Math.PI * 54;
  ring.style.strokeDasharray = CIRC;
  const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  const statusOf = t => {
    const ms = valueMs(t);
    if (t.type === 'down') {
      if (t.running) return ms > 0 ? 'Counting down' : 'Overtime';
      if (ms < 0) return 'Paused in overtime';
      if (ms === 0) return t.done ? 'Time’s up!' : 'Set a time';
      return 'Paused';
    }
    if (t.running) return 'Counting up';
    return ms !== 0 ? 'Paused' : 'Ready';
  };

  // Build the list rows once per structural change; tick() only updates text.
  const buildList = () => {
    $('timerList').innerHTML = state.timers.map(t => `
      <div class="trow ${t.type}" data-id="${t.id}">
        <div class="info">
          <div class="name">${esc(t.name)}</div>
          <div class="sub"></div>
        </div>
        <div class="time"></div>
        <button class="go" aria-label="Start or pause"></button>
        <button class="del" aria-label="Delete timer" title="Delete timer (stats are kept)">🗑</button>
      </div>`).join('');
  };

  const renderList = () => {
    document.querySelectorAll('.trow').forEach(row => {
      const t = state.timers.find(x => x.id === row.dataset.id);
      if (!t) return;
      const ms = valueMs(t);
      row.classList.toggle('sel', t.id === state.selected);
      row.classList.toggle('done', t.done && !t.running && ms >= 0);
      row.classList.toggle('over', ms < 0);
      row.querySelector('.time').textContent = fmtClock(ms, t.type);
      row.querySelector('.sub').textContent = `${t.type === 'down' ? '⏳ Countdown' : '⏱ Stopwatch'} · ${statusOf(t)}`;
      const go = row.querySelector('.go');
      go.textContent = t.running ? '❚❚' : '▶';
      go.classList.toggle('running', t.running);
    });
  };

  const renderSelected = () => {
    const t = sel();
    $('selectedView').classList.toggle('hidden', !t);
    $('entryCard').classList.toggle('hidden', !t);
    $('emptyView').classList.toggle('hidden', !!t);
    if (!t) { document.title = 'Studying Timer'; return; }

    const ms = valueMs(t);
    const text = fmtClock(ms, t.type);
    $('display').textContent = text;
    $('display').classList.toggle('long', text.length > 8);
    if (document.activeElement !== $('faceName')) $('faceName').value = t.name;

    // countdown: ring empties toward zero, then refills in red as overtime grows
    const frac = t.type === 'down'
      ? (t.total > 0 ? Math.min(1, Math.abs(ms) / t.total) : (ms < 0 ? 1 : 0))
      : (ms % 60000) / 60000; // stopwatch: sweep once per minute
    ring.style.transition = t.type === 'up' && frac < 0.01 ? 'none' : '';
    ring.style.strokeDashoffset = CIRC * (1 - frac);
    $('face').classList.toggle('done', t.done && !t.running && ms >= 0);
    $('face').classList.toggle('over', ms < 0);
    $('face').classList.toggle('up', t.type === 'up');

    $('status').textContent = statusOf(t);
    $('endsAt').textContent = t.running && t.type === 'down'
      ? (ms > 0 ? 'Ends at ' : 'Hit zero at ') + new Date(t.since + t.base).toLocaleString([], { weekday: Math.abs(ms) > 86400000 ? 'short' : undefined, hour: 'numeric', minute: '2-digit' })
      : '';

    const sb = $('startBtn');
    const fresh = t.type === 'down' ? t.base === t.total : t.base === 0;
    sb.textContent = t.running ? 'Pause' : (fresh ? 'Start' : 'Resume');
    sb.classList.toggle('running', t.running);

    $('entryFor').textContent = `— ${t.name}`;
    // once a countdown is finished, make removing it the obvious next step
    $('deleteBtn').textContent = t.done ? '✓ Done with it — delete timer' : '🗑 Delete timer';
    $('deleteBtn').classList.toggle('finished', t.done);
    $('setBtn').textContent = t.type === 'down' ? 'Set' : 'Set total';

    const running = state.timers.filter(x => x.running);
    const anyDone = state.timers.some(x => x.done);
    document.title = t.running ? `${text} · ${t.name}`
      : anyDone ? '⏰ Time’s up!'
      : running.length ? `${running.length} running · Studying Timer`
      : 'Studying Timer';
  };

  const fmtDate = ts => ts
    ? new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '—';
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  const renderTrash = () => {
    $('trashCard').classList.toggle('hidden', !state.trash.length);
    $('trashList').innerHTML = state.trash.map(t => `
      <div class="trash-row" data-id="${t.id}">
        <div class="info">
          <div class="name">${esc(t.name)}</div>
          <div class="sub">${t.type === 'down' ? 'Countdown' : 'Stopwatch'} · ${fmtClock(t.base, t.type)} · deleted ${fmtDate(t.deletedAt)}</div>
        </div>
        <button class="forever">Delete forever</button>
        <button class="restore">Restore</button>
      </div>`).join('');
  };

  const renderStats = () => {
    const all = [
      ...state.timers.map(t => [t, 'active', 'Active']),
      ...state.trash.map(t => [t, 'deleted', 'Recently deleted']),
      ...state.archive.map(t => [t, 'deleted', 'Deleted for good']),
    ];
    const totalSpent = all.reduce((sum, [t]) => sum + spentMs(t), 0);
    $('statsTotal').innerHTML = `Total time spent across all timers: <b>${fmtWords(totalSpent / 1000)}</b>`;
    $('statsList').innerHTML = all.map(([t, cls, label]) => {
      const used = t.runs + t.adds + t.subs;
      return `
      <div class="stat" data-id="${t.id}">
        <div class="stat-head">
          <span class="name">${esc(t.name)}</span>
          <span class="badge">${t.type === 'down' ? 'Countdown' : 'Stopwatch'}</span>
          <span class="badge ${cls}">${label}</span>
        </div>
        <dl>
          <div><dt>Created</dt><dd>${t.createdAt ? fmtDate(t.createdAt) : 'Unknown'}</dd></div>
          <div><dt>Deleted</dt><dd>${fmtDate(t.deletedAt)}</dd></div>
          <div><dt>Initial time</dt><dd>${t.initial !== null ? fmtWords(t.initial / 1000) : !t.createdAt ? 'Unknown' : (t.type === 'up' ? '0 sec' : 'Not set')}</dd></div>
          <div><dt>${t.type === 'down' ? 'Time remaining' : 'Current total'}</dt><dd>${fmtWords((t.type === 'down' ? Math.ceil : Math.floor)(valueMs(t) / 1000))}${valueMs(t) <= -1000 ? ' <small>(overtime)</small>' : ''}</dd></div>
          <div><dt>Time spent</dt><dd>${fmtWords(Math.floor(spentMs(t) / 1000))} <button class="edit-spent" title="Correct time spent">Edit</button></dd></div>
          <div><dt>Times used</dt><dd>${used}<br><small>${plural(t.runs, 'run')} · ${t.adds} added · ${t.subs} subtracted</small></dd></div>
        </dl>
      </div>`;
    }).join('') || '<p class="note">No timers yet.</p>';
  };

  const renderPreview = () => {
    const sec = readEntry();
    const p = $('preview');
    p.classList.toggle('err', Number.isNaN(sec));
    if (sec === null) p.textContent = '';
    else if (Number.isNaN(sec)) p.textContent = 'Enter a non-negative number';
    else p.textContent = `= ${fmtWords(sec)}`;
  };

  const renderMode = () => {
    const exact = state.mode === 'exact';
    $('modeExact').classList.toggle('on', exact);
    $('modeDecimal').classList.toggle('on', !exact);
    $('exactFields').classList.toggle('hidden', !exact);
    $('decimalFields').classList.toggle('hidden', exact);
    renderPreview();
  };

  const render = () => { renderList(); renderSelected(); };
  const commit = () => { save(); buildList(); render(); renderTrash(); renderStats(); };

  // ----- quick chips: minus row on top, matching plus row underneath -----
  const CHIP_STEPS = [[3600, '1h'], [1800, '30m'], [600, '10m'], [300, '5m'], [60, '1m']];
  [...CHIP_STEPS.map(([s, l]) => [-s, '−' + l]), ...CHIP_STEPS.map(([s, l]) => [s, '+' + l])]
    .forEach(([sec, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = sec < 0 ? 'minus' : 'plus';
      b.onclick = () => { const t = sel(); if (t) adjust(t, sec); };
      $('chips').appendChild(b);
    });

  // ----- wiring -----
  $('timerList').addEventListener('click', e => {
    const row = e.target.closest('.trow');
    if (!row) return;
    const t = state.timers.find(x => x.id === row.dataset.id);
    if (e.target.closest('.go')) { toggle(t); return; }
    if (e.target.closest('.del')) { deleteTimer(t); return; }
    state.selected = t.id;
    save(); render();
  });

  // Parse "17:52:45", "17:52", "17h 52m 45s", or decimal hours like "17.88" into seconds.
  const parseDuration = str => {
    str = str.trim().toLowerCase();
    if (!str) return NaN;
    if (/^\d+(:\d{1,2}){1,2}$/.test(str)) {
      const [h, m, sec = 0] = str.split(':').map(Number);
      return h * 3600 + m * 60 + sec;
    }
    const units = str.match(/^(?:(\d+(?:\.\d+)?)\s*h\w*)?\s*(?:(\d+(?:\.\d+)?)\s*m\w*)?\s*(?:(\d+(?:\.\d+)?)\s*s\w*)?$/);
    if (units && units[0] && (units[1] || units[2] || units[3])) {
      return Math.round((+units[1] || 0) * 3600 + (+units[2] || 0) * 60 + (+units[3] || 0));
    }
    return /^\d+(\.\d+)?$/.test(str) ? Math.round(Number(str) * 3600) : NaN;
  };
  const clockOf = sec => fmtClock(sec * 1000, 'up');

  $('statsList').addEventListener('click', e => {
    if (!e.target.closest('.edit-spent')) return;
    const id = e.target.closest('.stat').dataset.id;
    const t = [...state.timers, ...state.trash, ...state.archive].find(x => x.id === id);
    if (!t) return;
    const current = Math.floor(spentMs(t) / 1000);
    // For a countdown, suggest initial time − time remaining
    const suggested = t.type === 'down' && t.initial !== null
      ? Math.max(0, Math.round(t.initial / 1000) - Math.ceil(valueMs(t) / 1000))
      : current;
    const hint = t.type === 'down' && t.initial !== null
      ? `\n\nInitial time − time remaining = ${clockOf(suggested)} (filled in below).` : '';
    const answer = prompt(
      `Correct the time spent for "${t.name}".\nCurrently: ${clockOf(current)}${hint}\n\nEnter h:mm:ss (17:52:45), 17h 52m 45s, or decimal hours (17.88):`,
      clockOf(suggested));
    if (answer === null) return;
    const sec = parseDuration(answer);
    if (!isFinite(sec) || sec < 0) { alert('Couldn’t read that time. Try something like 17:52:45.'); return; }
    t.spentFix += sec * 1000 - spentMs(t);
    commit();
  });

  $('trashList').addEventListener('click', e => {
    const row = e.target.closest('.trash-row');
    if (!row) return;
    if (e.target.closest('.restore')) restoreTimer(row.dataset.id);
    if (e.target.closest('.forever')) deleteForever(row.dataset.id);
  });
  $('toastUndo').onclick = () => restoreTimer(lastDeleted);

  const openNew = show => {
    $('newCard').classList.toggle('hidden', !show);
    $('newBtn').classList.toggle('hidden', show);
    if (show) { $('newName').value = ''; $('newName').focus(); }
  };
  const setNewType = type => {
    newType = type;
    $('newDown').classList.toggle('on', type === 'down');
    $('newUp').classList.toggle('on', type === 'up');
  };
  $('newBtn').onclick = () => openNew(true);
  $('newCancel').onclick = () => openNew(false);
  $('newDown').onclick = () => setNewType('down');
  $('newUp').onclick = () => setNewType('up');
  $('newCreate').onclick = () => { createTimer($('newName').value, newType); openNew(false); };
  $('newName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('newCreate').click(); } });

  const rename = () => {
    const t = sel(); if (!t) return;
    const name = $('faceName').value.trim();
    if (name && name !== t.name) { t.name = name; commit(); }
    else $('faceName').value = t.name;
  };
  $('faceName').addEventListener('change', rename);
  $('faceName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('faceName').blur(); } });

  const withEntry = fn => () => {
    const t = sel(); if (!t) return;
    const sec = readEntry();
    if (sec === null || Number.isNaN(sec)) {
      renderPreview(); $('preview').classList.add('err');
      if (sec === null) $('preview').textContent = 'Enter a time first';
      return;
    }
    fn(t, sec);
  };

  $('setBtn').onclick = withEntry(setTime);
  $('addBtn').onclick = withEntry((t, sec) => adjust(t, sec));
  $('subBtn').onclick = withEntry((t, sec) => adjust(t, -sec));
  $('startBtn').onclick = () => { const t = sel(); if (t) toggle(t); };
  $('resetBtn').onclick = () => { const t = sel(); if (t) reset(t); };
  $('deleteBtn').onclick = () => { const t = sel(); if (t) deleteTimer(t); };
  $('modeExact').onclick = () => { state.mode = 'exact'; save(); renderMode(); };
  $('modeDecimal').onclick = () => { state.mode = 'decimal'; save(); renderMode(); };
  ['inH', 'inM', 'inS', 'inDec', 'inUnit'].forEach(id => $(id).addEventListener('input', renderPreview));

  document.addEventListener('keydown', e => {
    const typing = e.target.matches('input, select');
    if (e.code === 'Space' && !typing) { e.preventDefault(); $('startBtn').click(); }
    if (e.key === 'Enter' && typing && ['inH', 'inM', 'inS', 'inDec'].includes(e.target.id)) { e.preventDefault(); $('setBtn').click(); }
  });

  // ----- tick -----
  const checkFinished = () => {
    let changed = false;
    state.timers.forEach(t => {
      if (t.running && t.type === 'down' && !t.done && valueMs(t) <= 0) { finish(t); changed = true; }
    });
    return changed;
  };
  let ticks = 0;
  const tick = () => {
    if (checkFinished()) return commit();
    render();
    // live stats (time spent / remaining) once a second, only while something runs
    if (++ticks % 5 === 0 && state.timers.some(t => t.running)) renderStats();
  };

  load();
  if (!state.timers.length) createTimer('Timer 1', 'down');
  if (!sel()) state.selected = state.timers[0].id;
  checkFinished();
  renderMode();
  commit();
  setInterval(tick, 200);
})();
</script>
</body>
</html>
